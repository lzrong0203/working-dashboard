<!doctype html>
<html lang="zh-Hant" data-look="desk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Working Dashboard</title>
  <script>
    // pick the look before first paint: #look in the URL, else the last choice
    (function () {
      var L = ["desk", "studio", "flap", "kanban", "office"], h = location.hash.slice(1), s = null;
      try { s = localStorage.getItem("wd.look"); } catch (e) {}
      document.documentElement.dataset.look = L.indexOf(h) >= 0 ? h : (L.indexOf(s) >= 0 ? s : "desk");
    })();
  </script>
  <!-- fonts are optional: everything falls back to system fonts offline -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Huninn&family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&family=Pixelify+Sans:wght@500;700&display=swap">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <h1>Working Dashboard</h1>
    </div>
    <div id="counts" class="counts" aria-live="polite"></div>
    <nav id="tabs" class="tabs" role="tablist"></nav>
    <div id="realmfilter" class="realmfilter" role="group" aria-label="只看哪一邊的 session"></div>
    <label class="looks">風格 <select id="looks"></select></label>
    <div id="sources" class="sources"></div>
  </header>
  <main id="view" class="view"></main>
  <footer class="foot"><span id="clock"></span></footer>
  <script type="module" src="/app.js"></script>
</body>
</html>
